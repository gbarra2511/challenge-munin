name: tick

# Disparador do pipeline de ofertas + dreno do outbox de notificação
# (WhatsApp). Roda a cada 5 minutos chamando o endpoint protegido do backend.
# Ver PLANO.md §7 (pipeline); o /jobs/tick também faz o dispatch das notificações.

on:
  # Cron desativado até o backend estar deployado e os secrets
  # (API_URL, TICK_SECRET) configurados no repo. Reativar removendo
  # o comentário abaixo. Por enquanto, rodar manualmente via UI.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /jobs/tick
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            "${{ secrets.API_URL }}/jobs/tick"
