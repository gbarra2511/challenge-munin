name: tick

# Disparador do pipeline de ofertas. Roda a cada 5 minutos chamando o
# endpoint protegido do backend. Ver PLANO.md §7 para o algoritmo.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /jobs/tick
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.TICK_SECRET }}" \
            "${{ secrets.API_URL }}/jobs/tick"
